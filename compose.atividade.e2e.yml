# Ambiente E2E exclusivo da Atividade 2 (interface da pasta atividade/).
#
# - Projeto Docker próprio (aula4-atividade-e2e): não reutiliza contêineres,
#   redes ou volumes da demonstração (compose.yml) nem do laboratório (compose.e2e.yml).
# - Banco próprio (atividade_e2e) em tmpfs: os dados são descartados ao encerrar.
# - A porta do PostgreSQL não é publicada; os testes acessam o banco via
#   "docker compose exec" somente para restaurar os dados iniciais.
# - Não lê o .env: todas as credenciais e portas estão fixadas aqui.
name: aula4-atividade-e2e
services:
  database:
    build: ./database
    environment:
      POSTGRES_DB: atividade_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d atividade_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30

  server:
    build: ./server
    environment:
      SERVER_PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: atividade_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Interface testada: frontend da pasta atividade/ (Nginx encaminha /api ao server).
  atividade:
    build: ./atividade
    environment:
      SERVER_PORT: 3000
    ports:
      - "127.0.0.1:18081:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Só fica saudável quando o Nginx serve a página E consegue alcançar a API.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/students"]
      interval: 2s
      timeout: 5s
      retries: 30
